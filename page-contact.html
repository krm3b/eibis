<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- 文字化け防止 -->
    <meta charset="utf-8">
    <!-- タイトル -->
    <title>株式会社エイビス</title>
    <!-- ページ要約文 -->
    <meta name="description" content="株式会社エイビスのオフィシャルサイトです。名古屋を中心に愛知・岐阜・三重において、人材派遣・紹介予定派遣・アウトソーシングなど多彩な人材サービスと豊富な人材で、様々な企業様の利便性を向上させる提案をしています。">
    <!-- 表示領域設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- アイコン -->
    <link rel="shortcut icon" href="img/favicon.ico">
    <!-- ファイル読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <!--#include file="header.html" -->

    <!--*****************************************-->
    <!--* main                                  *-->
    <!--*****************************************-->
    <main class="page-contact margin">
        <div class="wrapper">

            <div class="main-title">
                <p>Contact<span>お問い合わせ</span></p>
            </div>

            <form class="contact-form">
                <dl>
                    <dt>会社名 <span class="required">【必須】</span></dt>
                    <dd><input type="text" name="company"></dd>
                </dl>

                <dl>
                    <dt>会社名（フリガナ） <span class="required">【必須】</span></dt>
                    <dd><input type="text" name="company_kana"></dd>
                </dl>

                <dl>
                    <dt>部署 <span class="required">【必須】</span></dt>
                    <dd><input type="text" name="department"></dd>
                </dl>

                <dl>
                    <dt>役職</dt>
                    <dd><input type="text" name="title"></dd>
                </dl>

                <dl>
                    <dt>お名前 <span class="required">【必須】</span></dt>
                    <dd><input type="text" name="name"></dd>
                </dl>

                <dl>
                    <dt>お名前（フリガナ） <span class="required">【必須】</span></dt>
                    <dd><input type="text" name="name_kana"></dd>
                </dl>

                <dl>
                    <dt>電話番号 <span class="required">【必須】</span></dt>
                    <dd><input type="tel" name="tel"></dd>
                </dl>

                <dl>
                    <dt>FAX番号</dt>
                    <dd><input type="tel" name="fax"></dd>
                </dl>

                <dl>
                    <dt>メールアドレス <span class="required">【必須】</span></dt>
                    <dd><input type="email" name="email"></dd>
                </dl>

                <dl>
                    <dt>住所 <span class="required">【必須】</span></dt>
                    <dd><input type="text" name="address"></dd>
                </dl>

                <dl>
                    <dt>お問い合わせ・ご依頼内容 <span class="required">【必須】</span></dt>
                    <dd><textarea name="message"></textarea></dd>
                </dl>

            </form>
            <p class="policy-text">ご記入いただいた個人情報はプライバシーポリシーに基づき管理いたします。</p>

            <a href="#" class="btn-view-more">
                <span class="text">送信</span>
                <span class="arrow-circle"></span>
            </a>

            <div class="page-background-logo">
                <img src="img/logo.webp" alt="">
            </div>
        </div>

    </main>

    <!--#include file="footer.html" -->


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
