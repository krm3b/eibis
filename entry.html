<!DOCTYPE html>
<html lang="ja">

<head>
    <!-- 文字化け防止 -->
    <meta charset="utf-8">
    <!-- タイトル -->
    <title>株式会社エイビス</title>
    <!-- ページ要約文 -->
    <meta name="description" content="株式会社エイビスのオフィシャルサイトです。名古屋を中心に愛知・岐阜・三重において、人材派遣・紹介予定派遣・アウトソーシングなど多彩な人材サービスと豊富な人材で、様々な企業様の利便性を向上させる提案をしています。">
    <!-- 表示領域設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- アイコン -->
    <link rel="shortcut icon" href="img/favicon.ico">
    <!-- ファイル読み込み -->
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
    <link rel="stylesheet" href="/themes/eibis/css/style.css">
</head>

<body>
    <!--#include file="header.html" -->


    <main class="page wrapper margin">


        <!-- BEGIN_MODULE Entry_Body -->
        <div>

            <!-- BEGIN entry:loop -->

            @include("/admin/entry/revision-info.html")

            <div class="acms-page-header">
                <!-- BEGIN title:veil -->
                <div class="main-title">
                    <p>{title}</p>
                </div>
                <!-- END title:veil -->
            </div>


            <div>
                <div>
                    <!-- BEGIN unit:veil -->

                    <div class="section-title">
                        @include("/include/unit.html")
                    </div>

                    <!-- END unit:veil -->

                    <!-- BEGIN continueLink:veil -->
                    <p><a href="{continueUrl}" class="acms-btn-flat"><span
                                class="acms-icon-arrow-right"></span>「{continueName}」の続きを読む</a></p>
                    <!-- END continueLink:veil -->

                    <!-- BEGIN formBody -->
                    @include("/include/form/unit.html")
                    <!-- END formBody -->

                    <!-- BEGIN tag:veil -->
                    <p>タグ：<!-- BEGIN tag:loop --><a href="{url}" class="acms-inline-space">{name}</a>
                        <!-- END tag:loop --></p>
                    <!-- END tag:veil -->

                    @include("/admin/entry/action.html")
                </div>

            </div>
            <!-- END entry:loop -->

            <!-- BEGIN pager:veil -->
            <div class="acms-text-center">
                <ul class="acms-pager">
                    <!-- BEGIN backLink -->
                    <li><a href="{url}">« 前の{backNum}件</a></li><!-- END backLink -->
                    <!-- BEGIN firstPage:veil -->
                    <li{pageCurAttr}[raw]><span><a href="{firstPageUrl}">{firstPage}</a></span></li>
                        <!-- END firstPage:veil -->
                        <!-- BEGIN omitBeforePage -->
                        <li>...</li><!-- END omitBeforePage -->
                        <!-- BEGIN page:loop --><!-- BEGIN glue --><!-- END glue -->
                        <li{pageCurAttr}[raw]><span><!-- BEGIN link#front --><a
                                    href="{url}"><!-- END link#front -->{page}<!-- BEGIN link#rear --></a><!-- END link#rear --></span>
                            </li><!-- END page:loop -->
                            <!-- BEGIN omitAfterPage -->
                            <li>...</li><!-- END omitAfterPage -->
                            <!-- BEGIN lastPage:veil -->
                            <li{pageCurAttr}[raw]><span><a href="{lastPageUrl}">{lastPage}</a></span></li>
                                <!-- END lastPage:veil -->
                                <!-- BEGIN forwardLink -->
                                <li><a href="{url}">次の{forwardNum}件 »</a></li><!-- END forwardLink -->
                </ul>
            </div>
            <!-- END pager:veil -->
        </div>

        <!-- END_MODULE Entry_Body -->


        <div class="page-background-logo">
            <img src="/themes/eibis_test/img/logo.webp" alt="">
        </div>

    </main>

    <!--#include file="footer.html" -->
</body>

</html>
